<!DOCTYPE html>
<!-- JS가 동작하지 않는 환경에서 폼 제출 시 보여지는 완료 페이지. -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상담 신청 완료 | HUMAN BRANDING</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --brand: #2457E6; --bg: #F6F8FC; --text: #1B1F2A; --muted: #5B6475; --kakao: #FEE500; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 20px; background: var(--bg); color: var(--text); font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif; text-align: center; word-break: keep-all; }
  .box { max-width: 420px; }
  h1 { font-size: 24px; margin: 0 0 10px; }
  p { color: var(--muted); line-height: 1.6; margin: 0; }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 12px; border-radius: 999px; font-weight: 700; text-decoration: none; }
  .kakao { background: var(--kakao); color: #191919; margin-top: 24px; }
  .home { border: 1.5px solid #E2E7F0; color: var(--muted); }
</style>
</head>
<body>
  <div class="box">
    <h1>상담 신청이 완료됐어요!</h1>
    <p>남겨주신 희망 시간에 맞춰 연락드릴게요.<br>궁금한 점은 카카오톡으로 편하게 물어보세요.</p>
    <a class="btn kakao" href="https://open.kakao.com/o/sT47TlSi" target="_blank" rel="noopener">카카오톡으로 물어보기</a>
    <a class="btn home" href="/">처음으로</a>
  </div>
</body>
</html>
